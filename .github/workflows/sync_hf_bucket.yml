name: sync_hf_bucket

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Print counts only; do not upload
        type: boolean
        default: false
      delete:
        description: Also remove remote files not present locally
        type: boolean
        default: false

concurrency:
  group: sync-hf-bucket
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Sync telemetry tree to Hugging Face
        run: |
          args=()
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            args+=(--dry-run)
          fi
          if [ "${{ inputs.delete }}" = "true" ]; then
            args+=(--delete)
          fi
          uv run sync_hf_bucket.py "${args[@]}"
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
